<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Directivos | Asistente IA AURA</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(145deg, #eef2f9 0%, #e0e8f0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .login-container {
            background: white;
            border-radius: 2rem;
            box-shadow: 0 25px 45px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 440px;
            padding: 2rem;
            text-align: center;
        }

        .logo {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
        }

        .sub {
            color: #5a6e8a;
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        .input-group {
            margin-bottom: 1.2rem;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.3rem;
            color: #1e2f3e;
        }

        .input-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid #dce4ec;
            border-radius: 2rem;
            font-family: inherit;
            outline: none;
            transition: 0.2s;
        }

        .input-group input:focus {
            border-color: #2a5298;
            box-shadow: 0 0 0 2px rgba(42,82,152,0.2);
        }

        .btn-auth {
            background: #2a5298;
            color: white;
            border: none;
            padding: 0.8rem;
            width: 100%;
            border-radius: 3rem;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 0.5rem;
        }

        .btn-auth:hover {
            background: #1e3c72;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: transparent;
            color: #2a5298;
            border: 1px solid #2a5298;
            margin-top: 1rem;
        }

        .btn-secondary:hover {
            background: #eef2ff;
        }

        .message {
            margin-top: 1rem;
            font-size: 0.85rem;
            min-height: 2rem;
        }

        .error {
            color: #c62828;
        }

        .success {
            color: #2e7d32;
        }

        hr {
            margin: 1.5rem 0;
            border: none;
            border-top: 1px solid #e2e8f0;
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="logo"><i class="fas fa-robot"></i> AURA</div>
    <div class="sub">Asistente IA para Dirección Escolar</div>

    <div id="loginForm">
        <div class="input-group">
            <label>Correo (Gmail)</label>
            <input type="email" id="loginEmail" placeholder="director@ejemplo.com">
        </div>
        <div class="input-group">
            <label>Contraseña</label>
            <input type="password" id="loginPassword" placeholder="••••••••">
        </div>
        <button class="btn-auth" id="loginBtn">Iniciar Sesión</button>
        <div id="loginMessage" class="message"></div>
    </div>

    <hr>

    <div id="registerForm">
        <div class="input-group">
            <label>Nuevo correo (Gmail)</label>
            <input type="email" id="regEmail" placeholder="nuevo@institucion.edu">
        </div>
        <div class="input-group">
            <label>Contraseña</label>
            <input type="password" id="regPassword" placeholder="Mínimo 6 caracteres">
        </div>
        <button class="btn-auth btn-secondary" id="registerBtn">Registrarse</button>
        <div id="regMessage" class="message"></div>
    </div>
</div>

<script>
    // Gestión de usuarios en localStorage
    const USERS_KEY = 'aura_users';

    function getUsers() {
        const stored = localStorage.getItem(USERS_KEY);
        return stored ? JSON.parse(stored) : {};
    }

    function saveUsers(users) {
        localStorage.setItem(USERS_KEY, JSON.stringify(users));
    }

    function register(email, password) {
        const users = getUsers();
        if (!email || !password) return { success: false, msg: 'Completa todos los campos.' };
        if (!email.includes('@')) return { success: false, msg: 'Ingresa un correo válido.' };
        if (password.length < 6) return { success: false, msg: 'La contraseña debe tener al menos 6 caracteres.' };
        if (users[email]) return { success: false, msg: 'El correo ya está registrado.' };
        users[email] = { password: password };
        saveUsers(users);
        return { success: true, msg: 'Registro exitoso. Ahora inicia sesión.' };
    }

    function login(email, password) {
        const users = getUsers();
        if (!users[email]) return { success: false, msg: 'Usuario no registrado.' };
        if (users[email].password !== password) return { success: false, msg: 'Contraseña incorrecta.' };
        // guardar sesión
        sessionStorage.setItem('aura_session', JSON.stringify({ email: email, loggedIn: true }));
        return { success: true, msg: 'Ingresando al sistema...' };
    }

    // UI eventos
    const loginBtn = document.getElementById('loginBtn');
    const registerBtn = document.getElementById('registerBtn');
    const loginMsg = document.getElementById('loginMessage');
    const regMsg = document.getElementById('regMessage');

    loginBtn.addEventListener('click', () => {
        const email = document.getElementById('loginEmail').value.trim();
        const pwd = document.getElementById('loginPassword').value;
        const result = login(email, pwd);
        if (result.success) {
            loginMsg.innerHTML = `<span class="success">✅ ${result.msg}</span>`;
            // Redirigir después de un breve retraso
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 800);
        } else {
            loginMsg.innerHTML = `<span class="error">❌ ${result.msg}</span>`;
        }
    });

    registerBtn.addEventListener('click', () => {
        const email = document.getElementById('regEmail').value.trim();
        const pwd = document.getElementById('regPassword').value;
        const result = register(email, pwd);
        if (result.success) {
            regMsg.innerHTML = `<span class="success">✅ ${result.msg}</span>`;
            document.getElementById('regEmail').value = '';
            document.getElementById('regPassword').value = '';
        } else {
            regMsg.innerHTML = `<span class="error">❌ ${result.msg}</span>`;
        }
    });
</script>
</body>
</html>
